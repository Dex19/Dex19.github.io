<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pocket Duel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #1b1f24;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .game {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    margin: 0 auto;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    background: #14181d;
    font-size: 13px;
    gap: 8px;
  }
  .hud .side { flex: 1; }
  .hud .name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .hud .p1 .name { color: #4cc1ff; }
  .hud .p2 .name { color: #ff7a59; }
  .hud .right { text-align: right; }
  .hp-wrap {
    width: 100%;
    height: 8px;
    background: #2a2f36;
    border-radius: 4px;
    overflow: hidden;
  }
  .hp-bar {
    height: 100%;
    background: #4caf50;
    transition: width 0.3s ease;
  }
  .turn-indicator {
    text-align: center;
    padding: 4px;
    font-size: 12px;
    background: #14181d;
    color: #ffd54f;
    border-top: 1px solid #2a2f36;
  }

  canvas {
    display: block;
    width: 100%;
    flex: 1;
    background: linear-gradient(#5fb3ff 0%, #a3d5ff 100%);
    touch-action: none;
  }

  .controls {
    background: #14181d;
    padding: 10px 12px 14px;
    border-top: 1px solid #2a2f36;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .ctrl-row label {
    width: 60px;
    font-size: 13px;
    color: #aab;
  }
  .ctrl-row .val {
    width: 50px;
    text-align: right;
    font-weight: 700;
    color: #4cc1ff;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #4cc1ff;
  }
  .fire-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  button.fire {
    flex: 1;
    background: #e94e1b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.fire:disabled { opacity: 0.5; cursor: not-allowed; }
  button.fire:active:not(:disabled) { background: #c63e10; }
  button.reset {
    background: #2a2f36;
    color: #ddd;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .panel {
    background: #1b1f24;
    border: 1px solid #2a2f36;
    border-radius: 12px;
    padding: 24px 28px;
    text-align: center;
    max-width: 300px;
  }
  .overlay h2 { margin: 0 0 8px; font-size: 22px; }
  .overlay p { margin: 0 0 16px; color: #bbb; font-size: 14px; }
  .overlay button {
    background: #4cc1ff;
    color: #14181d;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="side p1">
      <div class="name">YOU</div>
      <div class="hp-wrap"><div class="hp-bar" id="hpP1"></div></div>
    </div>
    <div class="side p2 right">
      <div class="name">CPU</div>
      <div class="hp-wrap"><div class="hp-bar" id="hpP2"></div></div>
    </div>
  </div>
  <div class="turn-indicator" id="turnIndicator">Your turn — aim and fire!</div>

  <canvas id="game"></canvas>

  <div class="controls">
    <div class="ctrl-row">
      <label>Angle</label>
      <input type="range" id="angle" min="0" max="180" value="45" />
      <div class="val"><span id="angleVal">45</span>°</div>
    </div>
    <div class="ctrl-row">
      <label>Power</label>
      <input type="range" id="power" min="10" max="100" value="60" />
      <div class="val"><span id="powerVal">60</span></div>
    </div>
    <div class="fire-row">
      <button class="fire" id="fireBtn">FIRE</button>
      <button class="reset" id="resetBtn">↻</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="overlayTitle">Victory!</h2>
    <p id="overlayMsg">You defeated the CPU.</p>
    <button id="overlayBtn">Play again</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const angleInput = document.getElementById('angle');
  const powerInput = document.getElementById('power');
  const angleVal = document.getElementById('angleVal');
  const powerVal = document.getElementById('powerVal');
  const fireBtn = document.getElementById('fireBtn');
  const resetBtn = document.getElementById('resetBtn');
  const hpP1 = document.getElementById('hpP1');
  const hpP2 = document.getElementById('hpP2');
  const turnIndicator = document.getElementById('turnIndicator');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const overlayBtn = document.getElementById('overlayBtn');

  let W = 0, H = 0;
  const GRAVITY = 220; // px/s^2
  const TANK_W = 30, TANK_H = 14;
  const BARREL_LEN = 18;

  let terrain = [];
  let tanks = [];
  let projectile = null;
  let particles = [];
  let turn = 0; // 0 = player, 1 = cpu
  let busy = false;
  let lastT = 0;
  let gameOver = false;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (terrain.length === 0) generateTerrain();
    placeTanks();
  }

  function generateTerrain() {
    terrain = new Array(Math.ceil(W) + 1);
    // Smooth hilly terrain via layered sines + random offset
    const base = H * 0.72;
    const seed = Math.random() * 1000;
    for (let x = 0; x <= W; x++) {
      const n =
        Math.sin((x + seed) * 0.013) * 28 +
        Math.sin((x + seed) * 0.031) * 14 +
        Math.sin((x + seed) * 0.07) * 6;
      terrain[x] = Math.min(H - 20, Math.max(H * 0.45, base + n));
    }
  }

  function terrainAt(x) {
    const xi = Math.max(0, Math.min(terrain.length - 1, Math.round(x)));
    return terrain[xi];
  }

  function placeTanks() {
    const x1 = Math.round(W * 0.12);
    const x2 = Math.round(W * 0.88);
    tanks = [
      { x: x1, y: terrainAt(x1), hp: 100, color: '#4cc1ff', barrel: '#2a8fc7' },
      { x: x2, y: terrainAt(x2), hp: 100, color: '#ff7a59', barrel: '#c63e10' }
    ];
  }

  function flattenTerrainAt(cx, radius) {
    const y = terrainAt(cx);
    for (let x = Math.max(0, cx - radius); x <= Math.min(terrain.length - 1, cx + radius); x++) {
      terrain[x] = Math.max(terrain[x], y);
    }
  }

  function carveCrater(cx, cy, r) {
    for (let x = Math.max(0, Math.round(cx - r)); x <= Math.min(terrain.length - 1, Math.round(cx + r)); x++) {
      const dx = x - cx;
      const dy = Math.sqrt(Math.max(0, r * r - dx * dx));
      const top = cy + dy * 0.6;
      if (top > terrain[x]) {
        terrain[x] = Math.min(H - 5, top);
      }
    }
    // Re-seat tanks on new ground
    tanks.forEach(t => { t.y = terrainAt(t.x); });
  }

  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#5fb3ff');
    grad.addColorStop(1, '#a3d5ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawTerrain() {
    ctx.fillStyle = '#5a8a3c';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x++) ctx.lineTo(x, terrain[x]);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // Grass cap
    ctx.strokeStyle = '#7fbf52';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= W; x++) {
      if (x === 0) ctx.moveTo(x, terrain[x]);
      else ctx.lineTo(x, terrain[x]);
    }
    ctx.stroke();
  }

  function drawTank(t, aimAngleDeg, isPlayer) {
    ctx.save();
    ctx.translate(t.x, t.y);
    // Treads
    ctx.fillStyle = '#222';
    ctx.fillRect(-TANK_W / 2, -TANK_H, TANK_W, TANK_H);
    // Body
    ctx.fillStyle = t.color;
    ctx.fillRect(-TANK_W / 2 + 2, -TANK_H - 6, TANK_W - 4, 8);
    // Turret
    ctx.fillStyle = t.barrel;
    ctx.beginPath();
    ctx.arc(0, -TANK_H - 6, 6, Math.PI, 0);
    ctx.fill();
    // Barrel
    const a = (aimAngleDeg * Math.PI) / 180;
    // For player (left tank): angle 0 = right, 90 = up, 180 = left
    // For CPU (right tank): mirror so its barrel points left at high angles
    const dir = isPlayer ? 1 : -1;
    const bx = Math.cos(a) * BARREL_LEN * dir;
    const by = -Math.sin(a) * BARREL_LEN;
    ctx.strokeStyle = t.barrel;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -TANK_H - 6);
    ctx.lineTo(bx, -TANK_H - 6 + by);
    ctx.stroke();
    ctx.restore();
  }

  function drawProjectile() {
    if (!projectile) return;
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    hpP1.style.width = Math.max(0, tanks[0].hp) + '%';
    hpP2.style.width = Math.max(0, tanks[1].hp) + '%';
    hpP1.style.background = tanks[0].hp > 40 ? '#4caf50' : tanks[0].hp > 15 ? '#ffb300' : '#e53935';
    hpP2.style.background = tanks[1].hp > 40 ? '#4caf50' : tanks[1].hp > 15 ? '#ffb300' : '#e53935';
  }

  function render() {
    drawSky();
    drawTerrain();
    const playerAngle = turn === 0 && !busy ? parseInt(angleInput.value, 10) : (tanks[0].lastAngle || 45);
    const cpuAngle = tanks[1].lastAngle || 135;
    drawTank(tanks[0], playerAngle, true);
    drawTank(tanks[1], cpuAngle, false);
    drawProjectile();
    drawParticles();
    drawHud();
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 30,
        r: 2 + Math.random() * 3,
        color: ['#ff5722', '#ffb300', '#ffd54f', '#666'][Math.floor(Math.random() * 4)],
        life: 1
      });
    }
  }

  function fire(shooterIdx, angleDeg, power) {
    if (busy || gameOver) return;
    busy = true;
    fireBtn.disabled = true;
    const shooter = tanks[shooterIdx];
    shooter.lastAngle = angleDeg;
    const dir = shooterIdx === 0 ? 1 : -1;
    const a = (angleDeg * Math.PI) / 180;
    const speed = power * 4.2; // tune
    const muzzleX = shooter.x + Math.cos(a) * BARREL_LEN * dir;
    const muzzleY = shooter.y - TANK_H - 6 - Math.sin(a) * BARREL_LEN;
    projectile = {
      x: muzzleX,
      y: muzzleY,
      vx: Math.cos(a) * speed * dir,
      vy: -Math.sin(a) * speed,
      shooter: shooterIdx
    };
  }

  function step(dt) {
    // Projectile physics
    if (projectile) {
      projectile.vy += GRAVITY * dt;
      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;

      // Off-screen sides → fizzle
      if (projectile.x < -50 || projectile.x > W + 50) {
        projectile = null;
        endTurn();
        return;
      }
      // Hit ground
      if (projectile.y >= terrainAt(projectile.x) || projectile.y > H) {
        const hx = projectile.x, hy = projectile.y;
        spawnExplosion(hx, hy);
        carveCrater(hx, hy, 22);
        applyBlast(hx, hy, 40, projectile.shooter);
        projectile = null;
        endTurn();
        return;
      }
      // Direct hit on a tank
      for (let i = 0; i < tanks.length; i++) {
        if (i === projectile.shooter) continue;
        const t = tanks[i];
        if (
          projectile.x > t.x - TANK_W / 2 &&
          projectile.x < t.x + TANK_W / 2 &&
          projectile.y > t.y - TANK_H - 12 &&
          projectile.y < t.y
        ) {
          spawnExplosion(projectile.x, projectile.y);
          applyBlast(projectile.x, projectile.y, 50, projectile.shooter);
          projectile = null;
          endTurn();
          return;
        }
      }
    }

    // Particles
    for (const p of particles) {
      p.vy += GRAVITY * dt * 0.4;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 1.4;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function applyBlast(x, y, radius, shooterIdx) {
    for (let i = 0; i < tanks.length; i++) {
      const t = tanks[i];
      const dx = x - t.x, dy = y - (t.y - TANK_H / 2 - 6);
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < radius) {
        const dmg = Math.round((1 - d / radius) * 35) + (i !== shooterIdx ? 5 : 0);
        t.hp = Math.max(0, t.hp - dmg);
      }
    }
    checkVictory();
  }

  function checkVictory() {
    if (gameOver) return;
    if (tanks[0].hp <= 0 || tanks[1].hp <= 0) {
      gameOver = true;
      busy = true;
      fireBtn.disabled = true;
      const playerWon = tanks[1].hp <= 0 && tanks[0].hp > 0;
      const draw = tanks[0].hp <= 0 && tanks[1].hp <= 0;
      overlayTitle.textContent = draw ? 'Draw!' : playerWon ? 'Victory!' : 'Defeat';
      overlayMsg.textContent = draw
        ? 'Both tanks destroyed.'
        : playerWon ? 'You defeated the CPU.' : 'The CPU destroyed your tank.';
      overlay.classList.add('show');
    }
  }

  function endTurn() {
    if (gameOver) return;
    turn = 1 - turn;
    busy = false;
    if (turn === 0) {
      fireBtn.disabled = false;
      turnIndicator.textContent = 'Your turn — aim and fire!';
    } else {
      fireBtn.disabled = true;
      turnIndicator.textContent = 'CPU is thinking…';
      setTimeout(cpuTurn, 700);
    }
  }

  function cpuTurn() {
    if (gameOver) return;
    // Simple AI: aim toward player with some randomness, vary power based on distance
    const dx = tanks[0].x - tanks[1].x; // negative (player is left)
    const dist = Math.abs(dx);
    // base angle ~ 135° (pointing upper-left from CPU's frame: drawTank mirrors with dir=-1)
    let angle = 45 + Math.random() * 20; // CPU uses 0-180 same scale; barrel direction handled by dir flip
    // Map to "world" angle: shoot up-left. With dir=-1 mirror, angle 45 means up-left
    let power = Math.min(100, 40 + dist * 0.10 + (Math.random() * 10 - 5));
    // Add occasional miss
    angle += (Math.random() * 16 - 8);
    fire(1, angle, power);
  }

  function loop(t) {
    const dt = Math.min(0.033, (t - lastT) / 1000 || 0);
    lastT = t;
    step(dt);
    render();
    requestAnimationFrame(loop);
  }

  function reset() {
    overlay.classList.remove('show');
    gameOver = false;
    busy = false;
    projectile = null;
    particles = [];
    turn = 0;
    generateTerrain();
    placeTanks();
    fireBtn.disabled = false;
    turnIndicator.textContent = 'Your turn — aim and fire!';
  }

  // Input wiring
  angleInput.addEventListener('input', () => { angleVal.textContent = angleInput.value; });
  powerInput.addEventListener('input', () => { powerVal.textContent = powerInput.value; });
  fireBtn.addEventListener('click', () => {
    if (turn !== 0 || busy || gameOver) return;
    fire(0, parseInt(angleInput.value, 10), parseInt(powerInput.value, 10));
  });
  resetBtn.addEventListener('click', reset);
  overlayBtn.addEventListener('click', reset);

  window.addEventListener('resize', resize);
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
